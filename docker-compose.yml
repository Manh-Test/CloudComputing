services:
  # Service 1: Microsoft SQL Server 2022 Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=manh123!
      - MSSQL_PID=Developer
    ports:
      - "14333:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P manh123! -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Service 2: Node.js CRUD Web Application
  web:
    build: .
    container_name: nodejs_crud_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_SERVER=db
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=manh123!
      - DB_NAME=EmployeeDB
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql_data:
    driver: local
